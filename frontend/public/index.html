<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#5b53c0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0e13" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="The official registry for fpm, the Fortran Package Manager"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo256.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>fpm registry</title>
    <script>
      /* Resolve the colour theme before first paint so a dark-mode user never
         sees a white flash. Kept in sync with src/theme/theme.js - it cannot
         import anything because the bundle has not loaded yet. */
      (function () {
        var theme;
        try {
          theme = window.localStorage.getItem("fpm-theme");
        } catch (e) {
          theme = null;
        }
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        document.documentElement.setAttribute("data-theme", theme);
        // Mirror onto data-bs-theme too. Bootstrap 5.3 gates its whole dark
        // palette on that attribute, so without it Bootstrap components stay
        // light inside a dark theme. Keep in sync with applyTheme() in
        // src/theme/theme.js -- this copy runs before first paint precisely so
        // there is no white flash, which is also why it cannot wait for the
        // bundle to load.
        document.documentElement.setAttribute("data-bs-theme", theme);
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
