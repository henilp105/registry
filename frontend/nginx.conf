server {
    listen 80;
    server_name localhost;
    
    # Serve React frontend
    root /usr/share/nginx/html;
    index index.html;

    # Handle React Router - serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API requests against a same-origin build: setting
    # REACT_APP_REGISTRY_API_URL=/api at build time routes API calls here.
    location /api/ {
        proxy_pass http://backend:9090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
    }

    # Cache static assets. Only the CRA build output under /static/ is
    # content-hashed, so only it gets `immutable` + 1y: the files served from
    # public/ (favicon.ico, logo*.png, manifest.json) are un-hashed, and
    # pinning them to 1y-immutable would make an update impossible to ship.
    location ^~ /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1d;
        add_header Cache-Control "public";
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;
}
