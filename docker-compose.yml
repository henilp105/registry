# Fortran Package Registry - Docker Compose
# Full-stack deployment: Frontend + Backend + MongoDB + HTTPS
#
# Quick Start:
#   1. Generate SSL certificates (self-signed for dev):
#      cd nginx/ssl && openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#        -keyout privkey.pem -out fullchain.pem -subj "/CN=localhost"
#   2. docker compose up -d
#
# For Let's Encrypt certificates:
#   docker compose --profile certbot up -d
#   docker compose exec certbot certbot certonly --webroot -w /var/www/certbot -d yourdomain.com
#
# Access:
#   - Frontend: https://localhost (HTTP redirects to HTTPS)
#   - API: https://localhost/api/
#
# Stop:
#   docker compose down

services:
  # ===========================================
  # HTTPS Nginx - SSL termination reverse proxy
  # ===========================================
  nginx:
    image: nginx:alpine
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot-webroot:/var/www/certbot:ro
    depends_on:
      - frontend
    restart: unless-stopped
    networks:
      - registry-network

  # ===========================================
  # Certbot - SSL certificate management (optional)
  # ===========================================
  certbot:
    image: certbot/certbot
    volumes:
      - ./nginx/ssl:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    profiles:
      - certbot
    networks:
      - registry-network

  # ===========================================
  # Frontend - React app served by Nginx
  # ===========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - registry-network

  # ===========================================
  # Backend - Flask API server
  # ===========================================
  backend:
    build:
      context: ./backend
      dockerfile: docker/backend.Dockerfile
      target: builder
    environment:
      - MONGO_URI=mongodb://mongo:27017/
      - MONGO_DB_NAME=${MONGO_DB_NAME:-fpmregistry}
      - MONGO_USER_NAME=${MONGO_USER_NAME:-}
      - MONGO_PASSWORD=${MONGO_PASSWORD:-}
      - SALT=${SALT:-change_this_salt}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change_this_jwt_secret}
      - HOST=${HOST:-localhost}
      - RESET_EMAIL=${RESET_EMAIL:-}
      - RESET_PASSWORD=${RESET_PASSWORD:-}
      - SUDO_PASSWORD=${SUDO_PASSWORD:-admin}
      - BREVO_API_KEY=${BREVO_API_KEY:-}
      - BREVO_SENDER_EMAIL=${BREVO_SENDER_EMAIL:-}
      - BREVO_SENDER_NAME=${BREVO_SENDER_NAME:-FPM Registry}
    volumes:
      - package-tarballs:/src/static/tarballs
    depends_on:
      - mongo
    restart: unless-stopped
    stop_signal: SIGINT
    networks:
      - registry-network

  # ===========================================
  # Package Validator - Validates uploaded packages
  # ===========================================
  validator:
    build:
      context: ./backend
      dockerfile: docker/validate_package.Dockerfile
    environment:
      - MONGO_URI=mongodb://mongo:27017/
      - MONGO_DB_NAME=${MONGO_DB_NAME:-fpmregistry}
      - SALT=${SALT:-change_this_salt}
    depends_on:
      - mongo
    restart: unless-stopped
    stop_signal: SIGINT
    networks:
      - registry-network

  # ===========================================
  # MongoDB - Database
  # ===========================================
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    networks:
      - registry-network

# ===========================================
# Volumes - Persistent data storage
# ===========================================
volumes:
  mongo-data:
    driver: local
  package-tarballs:
    driver: local
  certbot-webroot:
    driver: local

# ===========================================
# Networks
# ===========================================
networks:
  registry-network:
    driver: bridge
