# HTTPS Nginx Reverse Proxy Configuration
# Terminates SSL and proxies to frontend

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name _;
    
    # For Let's Encrypt certificate renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name _;

    # SSL certificates (mounted from host or generated by certbot)
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # SSL configuration (modern settings)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 127.0.0.11 valid=30s;  # Docker internal DNS resolver
    resolver_timeout 5s;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    # Proxy settings
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300;
    proxy_connect_timeout 300;

    # Client body size (for package uploads)
    client_max_body_size 100M;

    # Use variables for runtime DNS resolution
    set $frontend_upstream http://frontend:80;
    set $backend_upstream http://backend:9090;

    # ===========================================
    # Backend API Routes
    # ===========================================
    
    # API root endpoint
    location = /api/ {
        proxy_pass $backend_upstream/;
    }
    
    location = /api {
        proxy_pass $backend_upstream/;
    }

    # Authentication routes - match /auth and /auth/*
    location /auth {
        proxy_pass $backend_upstream;
    }

    # Package routes - match /packages and /packages/*
    location /packages {
        proxy_pass $backend_upstream;
    }

    # Namespace routes - match /namespaces and /namespaces/*
    location /namespaces {
        proxy_pass $backend_upstream;
    }

    # User routes - match /users and /users/*
    location /users {
        proxy_pass $backend_upstream;
    }

    # Account route
    location /account {
        proxy_pass $backend_upstream;
    }

    # Health and monitoring routes
    location = /health {
        proxy_pass $backend_upstream/health;
    }
    
    location = /latency {
        proxy_pass $backend_upstream/latency;
    }

    # Registry archives
    location /registry {
        proxy_pass $backend_upstream;
    }

    # Swagger documentation
    location /apidocs {
        proxy_pass $backend_upstream;
    }
    
    location /apispec {
        proxy_pass $backend_upstream;
    }
    
    location /flasgger_static {
        proxy_pass $backend_upstream;
    }

    # ===========================================
    # Frontend (default - catches all other routes)
    # ===========================================
    location / {
        proxy_pass $frontend_upstream;
    }
}
