# HTTPS Nginx Reverse Proxy Configuration for Backend
# Terminates SSL and proxies to Flask backend

# Redirect HTTP to HTTPS for registry-phi.vercel.app; redirect other hosts to canonical domain
server {
    listen 80;
    server_name registry-phi.vercel.app;

    # Redirect to HTTPS canonical host
    location / {
        return 301 https://registry-phi.vercel.app$request_uri;
    }
}

server {
    listen 80 default_server;
    server_name _;

    # Respond 204 to all other hosts (lightweight, no body)
    location / {
        return 204;
    }
}

# Default HTTPS server for unknown SNI: return 204 (no body) — keeps TLS handshake minimal
server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    # Respond with 204 for unknown hostnames (no proxying)
    location / {
        return 204;
    }
}

# HTTPS server for canonical host (registry-phi.vercel.app)
server {
    listen 443 ssl;
    http2 on;
    server_name registry-phi.vercel.app;

    # Docker DNS resolver
    resolver 127.0.0.11 valid=30s;

    # SSL certificates (mounted from host)
    # Use server.crt/server.key for self-signed or fullchain.pem/privkey.pem for Let's Encrypt
    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    # SSL configuration (modern settings)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    # Proxy settings
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300;
    proxy_connect_timeout 300;

    # Proxy all requests to backend Flask server
    location / {
        set $backend_upstream http://backend:9090;
        proxy_pass $backend_upstream;
    }

    # Client body size (for package uploads)
    client_max_body_size 100M;
}
