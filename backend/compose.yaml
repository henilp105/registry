services:
  web:
    image: nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    depends_on:
      - backend
    restart: unless-stopped

  # Database migration service - loads data from external MongoDB
  # Set SOURCE_MONGO_URI environment variable to enable migration
  db_migrate:
    build:
      context: .
      target: builder
      dockerfile: docker/backend.Dockerfile
    volumes:
      - .:/src
    environment:
      - SOURCE_MONGO_URI=${SOURCE_MONGO_URI:-}
      - TARGET_MONGO_URI=mongodb://mongo:27017/
      - MONGO_DB_NAME=${MONGO_DB_NAME:-fpm_registry}
    command: >
      /bin/bash -c "
        if [ -n \"$$SOURCE_MONGO_URI\" ]; then
          echo 'Running database migration from SOURCE_MONGO_URI...';
          python /src/scripts/migrate_db.py 
            --source-uri \"$$SOURCE_MONGO_URI\" 
            --target-uri mongodb://mongo:27017/ 
            --db-name $${MONGO_DB_NAME:-fpm_registry};
        else
          echo 'SOURCE_MONGO_URI not set, skipping database migration';
        fi
      "
    depends_on:
      mongo:
        condition: service_started

  backend:
    build:
      context: .
      target: builder
      dockerfile: docker/backend.Dockerfile
    # flask requires SIGINT to stop gracefully
    # (default stop signal from Compose is SIGTERM)
    stop_signal: SIGINT
    volumes:
      - .:/src
    depends_on:
      db_migrate:
        condition: service_completed_successfully
      mongo:
        condition: service_started

  validate_package:
    build:
      context: .
      dockerfile: docker/validate_package.Dockerfile
    stop_signal: SIGINT
    volumes:
      - .:/src
    ports:
      - "5001:5001"
    environment: # these are the test environment variables.
      - MONGO_URI=mongodb://mongo:27017/
      - SALT=MYSALT
      - MONGO_DB_NAME=fpmregistry
      - MONGO_USER_NAME=fortran
      - MONGO_PASSWORD=fortran

  mongo:
    image: mongo
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

# Volumes - Persistent data storage (survives container deletion)
volumes:
  mongo-data:
    driver: local