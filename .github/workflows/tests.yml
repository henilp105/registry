name: Run Tests for Backend

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]
  workflow_dispatch:

env:
    MONGO_DB_NAME: testregistry
    MONGO_URI: mongodb://localhost:27017/
    MONGO_USER_NAME: Admin
    MONGO_PASSWORD: Admin
    SALT: MYSALT
    HOST: localhost
    RESET_EMAIL: reset@localhost.com
    RESET_PASSWORD: reset
    SUDO_PASSWORD: fortran
    IS_CI: true
    JWT_SECRET_KEY: fpm-registry-test-secret-key

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout page source
        uses: actions/checkout@v4

      - name: MongoDB in GitHub Actions
        uses: supercharge/mongodb-github-action@1.10.0
        with:
          mongodb-port: 27017  
          
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
  
      - name: Install python libraries
        run: pip3 install --user -r backend/requirements.txt

      - name: Run unit tests
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short --color=yes

      - name: Run tests with coverage
        if: github.event_name == 'pull_request'
        run: |
          cd backend
          pip install pytest-cov
          python -m pytest tests/ -v --cov=. --cov-report=term-missing