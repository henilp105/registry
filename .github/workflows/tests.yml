name: Run Tests for Validator

# The Flask backend this workflow used to exercise has been removed as part of the
# serverless migration; the API now lives in `worker/` and is covered by
# `.github/workflows/worker.yml`. What remains here is the test suite for the
# package validator (`scripts/validate_packages.py`), which still runs on GitHub
# Actions runners and is the code that unpacks a publisher-controlled tarball --
# exactly the surface where a silent regression is most costly.

on:
  # `"**"`, not `"*"`. GitHub's glob `*` does not cross a `/`, so `"*"` silently
  # matched no branch containing a slash.
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  validator:
    name: Package validator
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # tomli is a TOML backstop for anything older than 3.11 (stdlib from 3.11).
      # numpy is required by the FNV-1a test: the reference implementation it
      # cross-checks reproduces the legacy numpy int64 overflow, so a numpy-free
      # run errors instead of asserting the digest still matches fpm.
      - name: Install test dependencies
        run: pip install --quiet pytest tomli numpy

      # Defect D125: scripts/test_validate_packages.py is the only test for
      # scripts/validate_packages.py -- the validator that replaced the
      # shell-injectable backend/validate.py -- and nothing in the repository ran
      # it. Its 60-odd assertions about traversal, symlink/hardlink escapes and the
      # FNV-1a compatibility digest were correct and never executed, so a
      # regression that reintroduced any of those defences would have merged green.
      - name: Validate the validator
        run: python -m pytest scripts/test_validate_packages.py -v --tb=short --color=yes
