name: Worker (serverless API)

on:
  # Any branch, so an integration or hotfix branch cannot merge with a broken
  # Worker unnoticed. This was a branch allow-list, and the first integration
  # branch of the migration ran zero Worker checks as a result.
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: worker-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: worker

jobs:
  check:
    name: typecheck, lint, test, bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # wrangler 4.x requires Node >= 22.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Proves the bundle fits inside the 64 MiB Worker size limit and that
      # every binding in wrangler.jsonc resolves. `mongodb` is the bulk of it.
      - name: Bundle check
        run: npx wrangler deploy --dry-run --outdir=dist

      # Regenerates worker-configuration.d.ts from wrangler.jsonc, which
      # validates every binding reference in the config. No `|| true`: a
      # malformed binding must fail here rather than at publish time.
      - name: Wrangler config check
        run: npx wrangler types

  contract:
    name: API contract is frozen
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The workflow default puts every job in worker/; these assertions are about
    # repo-root docs, so this job must run from the root.
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - name: Assert the contract documents still exist and are non-trivial
        run: |
          set -euo pipefail
          for f in docs/API_CONTRACT.md docs/SERVERLESS_MIGRATION_PLAN.md docs/BASELINE_AUDIT.md; do
            if [ ! -s "$f" ]; then echo "missing or empty: $f"; exit 1; fi
            echo "ok: $f ($(wc -l < "$f") lines)"
          done

  theme-contract:
    name: Theme contract holds
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Repo-root job: these assertions are about frontend source, not the Worker.
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      # The theme is written twice: once in `applyTheme()` and once as an inline
      # script in index.html that must run before first paint. The source comment
      # says "keep the two in sync", which is a request, not a mechanism -- and
      # they did drift, silently, with no failing build.
      #
      # The failure that mattered: `data-theme` was set but `data-bs-theme` was
      # not, so Bootstrap 5.3 stayed in its light palette inside our dark theme.
      # `.navbar` declares `--bs-navbar-color: rgba(0,0,0,.65)` as its light
      # default, so the top-level nav links rendered black-on-black at 1.11:1.
      # A token audit cannot catch this -- every token was correct and the defect
      # lived in a layer the theme does not own.
      - name: Both theme writers must set data-bs-theme
        run: |
          set -euo pipefail
          for f in frontend/src/theme/theme.js frontend/public/index.html; do
            if ! grep -q 'data-bs-theme' "$f"; then
              echo "FAIL: $f sets data-theme but not data-bs-theme."
              echo "      Bootstrap 5.3 gates its dark palette on data-bs-theme, so"
              echo "      omitting it leaves every Bootstrap component in light colours"
              echo "      inside the dark theme."
              exit 1
            fi
            echo "ok: $f sets data-bs-theme"
          done

      # A colour rule that never matches is worse than no rule: it reads as
      # deliberate and silently does nothing. `.nav` was used where
      # react-bootstrap renders `.navbar-nav`, so the nav colour override applied
      # to nothing at all.
      - name: Nav colour override must target the element that exists
        run: |
          set -euo pipefail
          if ! grep -q '\.navbar-nav' frontend/src/App.css; then
            echo "FAIL: frontend/src/App.css has no .navbar-nav rule."
            echo "      react-bootstrap's <Nav> renders <div class=\"navbar-nav\">, not"
            echo "      the <ul class=\"nav\"> of Bootstrap 4."
            exit 1
          fi
          echo "ok: nav colour override targets .navbar-nav"

      # The Register CTA is both `.nav-link` and `.btn-primary`. Bootstrap's
      # `.nav-link { background: 0 0 }` is a shorthand that resets
      # background-color, so the button lost its background and rendered as white
      # text with nothing behind it -- 1.0:1 on the light page. The longhand must
      # be restated.
      - name: The nav CTA must restate its background as a longhand
        run: |
          set -euo pipefail
          if ! grep -q 'nav-cta' frontend/src/App.css \
             || ! grep -A3 'nav-cta {' frontend/src/App.css | grep -q 'background-color'; then
            echo "FAIL: .navbar-nav .nav-cta does not set background-color."
            echo "      Without it the Register button is transparent with white text."
            exit 1
          fi
          echo "ok: nav CTA restates background-color"

  scripts-load:
    name: Verification scripts load
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Repo-root job.
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # `scripts/rate_limit_probe.cjs` sat in the repo with its `mongodb` import
      # deleted by a bad edit. It still parsed, so `node --check` passed, so it
      # looked fine -- and it produced *no output at all* when run, which I read as
      # "nothing to report" rather than "it crashed on line 44".
      #
      # These harnesses are the only coverage several defects have, so a silently
      # broken one is worse than an absent one. This step loads each script far
      # enough to prove its imports resolve, without needing a live API or cluster.
      - name: Node scripts parse
        run: |
          set -euo pipefail
          fail=0
          for f in scripts/*.cjs; do
            node --check "$f" || { echo "SYNTAX: $f"; fail=1; }
          done
          for f in scripts/*.mjs; do
            node --input-type=module --check < "$f" || { echo "SYNTAX: $f"; fail=1; }
          done
          [ "$fail" -eq 0 ] && echo "all node scripts parse"

      - name: Node scripts resolve their imports
        run: |
          set -euo pipefail
          # node --check does not resolve imports, which is the gap this covers.
          # `npm ci` in worker/ provides the mongodb driver the harnesses need.
          (cd worker && npm ci --silent --no-audit --no-fund)
          fail=0
          for f in scripts/rate_limit_probe.cjs; do
            cp "$f" worker/_loadcheck.cjs
            node -e "require('./worker/_loadcheck.cjs')" >/dev/null 2>&1 || true
            # Loading runs main(); we only care that it does not die on a missing
            # binding, so probe the identifier directly instead.
            node -e "
              const src = require('fs').readFileSync('$f','utf8');
              if (!/require\(\"mongodb\"\)/.test(src) && /MongoClient/.test(src)) {
                console.error('$f uses MongoClient without importing mongodb');
                process.exit(1);
              }
            " || fail=1
            rm -f worker/_loadcheck.cjs
          done
          for f in scripts/write_path_audit.mjs scripts/write_path_fuzz.mjs; do
            node -e "
              const src = require('fs').readFileSync('$f','utf8');
              if (!/^import .*mongodb/m.test(src) && /MongoClient/.test(src)) {
                console.error('$f uses MongoClient without importing mongodb');
                process.exit(1);
              }
            " || fail=1
          done
          [ "$fail" -eq 0 ] && echo "all harness imports present"
          exit "$fail"

      - name: No credential in tracked source
        run: |
          set -euo pipefail
          # Defect D71: seven harnesses carried the production MongoDB URI, password
          # included, in a *public* repository, so the Atlas cluster's read/write
          # credential was world-readable. Nothing else in the pipeline noticed --
          # typecheck, lint, 337 tests, five CI jobs and six harnesses all passed
          # with a live credential in the tree. This is the only check that can.
          node scripts/check_no_secrets.mjs

      # Defect D87: the Worker and scripts/validate_packages.py were shell-free
      # from day one, so every scan of the migration covered files that had
      # already been fixed -- and missed backend/validate.py, which still built
      # four `shell=True` commands from a package name read out of the database.
      - name: No shell-interpolated subprocess in Python
        run: node scripts/check_no_shell_injection.mjs

      - name: Frontend Redux helpers behave
        run: |
          set -euo pipefail
          # Defect D69: `handleSuccess(state, action)` read `action.payload`, but all
          # nine call sites passed a plain fields object, so every one of those
          # handlers silently reduced to "clear the spinner". The symptom was a
          # publish credential that the server minted and stored and the UI never
          # showed.
          #
          # The frontend has no test runner, and adding one for four pure functions
          # is a large dependency decision. The real source is imported as written
          # instead, so this guards what ships rather than a copy of it.
          node scripts/check_store_helpers.mjs

      # Not a deploy gate in CI -- the KV ids legitimately do not exist until
      # someone creates the namespaces -- so it runs in report mode and the log
      # records exactly what is outstanding. Turn it into a hard gate by adding
      # `--strict` once the ids are in place.
      - name: Deploy readiness (report only)
        run: |
          set -uo pipefail
          node scripts/check_deploy_ready.mjs production || true

      - name: Python scripts parse
        run: |
          set -euo pipefail
          for f in scripts/*.py; do python3 -c "import ast,sys;ast.parse(open('$f').read())" || exit 1; done
          echo "all python scripts parse"

  frontend-source:
    name: Frontend source invariants
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # These two checks read `frontend/src` rather than `frontend/build`, so they
    # assert intent rather than output. They live in their own job because they
    # are the only checks that need `frontend/node_modules` installed -- which is
    # exactly the mistake D105 was: adding them to `scripts-load`, whose setup
    # only installs `worker/`, so `@babel/core` was absent and the check died
    # with an `ERR_MODULE_NOT_FOUND` that named neither the script nor the cause.
    #
    # `check_form_labels.mjs` needs nothing but `node`, but it is kept here so the
    # two frontend-source invariants are read and fixed as one thing.
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      # Defect D97: only `auth` was cleared on logout, and `logout()` navigates
      # without a page reload -- so signing in as a different account in the same
      # tab showed user B the previous account's packages, namespaces and role
      # chips. A cross-account disclosure that no per-page `if` could be trusted
      # to prevent, since the bug was the *absence* of a reset.
      - name: Signing out wipes every account-scoped slice
        run: node ../scripts/check_session_reset.mjs

      # Defect D104: 17 form fields across the admin page's action cards and all
      # six maintainer/admin dialogs had no controlId, so react-bootstrap rendered
      # a <label> with no `for` and a control with no `id` -- no accessible name,
      # and clicking the label did not focus the field. The reset-password form
      # carried a comment calling itself the only one with the omission, and it
      # was not: an inventory written by reading one file is an inventory of one
      # file.
      - name: Every form field is programmatically labelled
        run: node ../scripts/check_form_labels.mjs

      # Proves the tree the two checks above ran against is the tree that ships.
      # Without this they would happily pass on source that no longer builds.
      - name: Production build
        run: npm run build
        env:
          CI: false

      - name: Frontend deploy config is inlined
        run: |
          set -euo pipefail
          # REACT_APP_REGISTRY_API_URL is baked in at build time by DefinePlugin,
          # so a bundle built without it points at `undefined` and every request
          # fails at runtime with no build-time signal. This is the same trap as
          # the API host in .env.production, and it is invisible to any check that
          # does not look at the *output*.
          grep -rq 'registry.fortran-lang.org' build/static/js/ \
            || { echo "FAIL: no registry host found in the built bundle."; exit 1; }
          echo "ok: registry host inlined into the bundle"
